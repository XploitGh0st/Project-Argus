[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-cfg"
version = "0.1.0"
description = "Argus: convert a Verilog AST into a Control Flow Graph (FSM state machines)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyverilog>=1.3.0", "networkx>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
argus-cfg = "argus_cfg.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_cfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "fixtures"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

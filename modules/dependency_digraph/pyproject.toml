[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-digraph"
version = "0.1.0"
description = "Merges CFG and DFG into a unified dependency digraph"
requires-python = ">=3.9"
dependencies = [
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus_digraph"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "PL", "C90", "T20", "S", "B", "A", "C4", "PT"]
ignore = ["S101", "PLR2004", "T201", "C901", "PLR0912", "E501", "PLC0415"]

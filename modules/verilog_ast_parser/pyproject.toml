[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-ast"
version = "0.1.0"
description = "Argus: Verilog ingestion and Abstract Syntax Tree (AST) generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyverilog>=1.3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
argus-ast = "argus_ast.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_ast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
